<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>طالب AI</title>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff7e8);--tx:var(--tg-theme-text-color,#222);
  --hint:var(--tg-theme-hint-color,#8a8272);--sec:var(--tg-theme-secondary-bg-color,#ffffff);
  --accent:#ff6b6b;--shadow:rgba(0,0,0,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,"Apple Color Emoji","Noto Color Emoji",sans-serif;padding-bottom:96px}
.wrap{padding:18px 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
.top h1{font-size:23px;font-weight:800;margin:0;line-height:1.3}
.cr{display:flex;flex-direction:column;gap:9px;margin:-6px 0 16px}.chip.lk{width:100%;text-align:right;border-radius:16px;padding:10px 14px;border:0;font-family:inherit;color:var(--text,#3a2a6a);cursor:pointer;font-size:12.5px}
.chip{background:var(--sec);border-radius:99px;padding:7px 13px;font-weight:700;font-size:13px;box-shadow:0 3px 0 var(--shadow);color:#e8590c;white-space:nowrap}
h2{font-size:17px;font-weight:800;margin:18px 2px 10px}
.big{display:flex;gap:12px;margin-bottom:6px}
.big>button{flex:1;border:0;border-radius:26px;padding:16px 14px;color:#fff;font-family:inherit;font-weight:800;font-size:17px;text-align:right;box-shadow:0 6px 0 var(--shadow);cursor:pointer}
.big .a{background:#ff6b6b}.big .b{background:#845ef7}
.ico{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.28);border-radius:15px;width:46px;height:46px;font-size:26px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.t{border:0;border-radius:24px;padding:14px;color:#fff;font-family:inherit;font-weight:800;font-size:15px;text-align:right;min-height:100px;box-shadow:0 6px 0 var(--shadow);display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.t .ico{width:42px;height:42px;font-size:24px;margin:0}
.c0{background:#12b886}.c1{background:#339af0}.c2{background:#f59f00;color:#3b2a00}.c3{background:#f06595}.c4{background:#7950f2}.c5{background:#ff922b}.c6{background:#20c997}.c7{background:#fa5252}
.t:active,.big>button:active,.row:active,.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.card{background:var(--sec);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 4px 0 var(--shadow)}
.hint{color:var(--hint);font-size:14px;line-height:1.8}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sec);border-radius:20px;padding:15px;margin-bottom:10px;box-shadow:0 4px 0 var(--shadow);cursor:pointer;font-weight:700}
.row small{color:var(--hint);font-weight:600}
.btn{border:0;background:#ff6b6b;color:#fff;border-radius:18px;padding:13px 20px;font-size:16px;font-weight:800;font-family:inherit;box-shadow:0 4px 0 var(--shadow);cursor:pointer}
.btn.purple{background:#845ef7}.btn.green{background:#12b886}.btn.ghost{background:var(--sec);color:var(--tx)}
.btn:disabled{opacity:.6}
.pill{display:inline-block;background:var(--sec);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:700;box-shadow:0 3px 0 var(--shadow);margin-bottom:12px;cursor:pointer}
.empty{text-align:center;color:var(--hint);padding:34px 10px;line-height:2}
.inp{width:100%;min-height:130px;border:0;background:var(--sec);color:var(--tx);border-radius:20px;padding:14px;font-family:inherit;font-size:15px;resize:vertical;margin-bottom:12px;box-shadow:inset 0 2px 0 var(--shadow)}
.filebtn{display:flex;align-items:center;gap:8px;background:var(--sec);border-radius:18px;padding:13px;margin-bottom:12px;font-weight:700;box-shadow:0 4px 0 var(--shadow);cursor:pointer}
.filebtn input{display:none}
.res{background:var(--sec);border-radius:22px;padding:16px;white-space:pre-wrap;line-height:2;font-size:15px;margin-top:14px;word-break:break-word;box-shadow:0 4px 0 var(--shadow)}
.opt{display:block;width:100%;text-align:right;background:var(--sec);color:var(--tx);border:3px solid transparent;border-radius:18px;padding:14px;margin-bottom:10px;font-family:inherit;font-size:16px;font-weight:700;box-shadow:0 4px 0 var(--shadow)}
.opt.ok{border-color:#12b886;background:#d3f9e8;color:#0b6b4d}.opt.bad{border-color:#fa5252;background:#ffe3e3;color:#a61e1e}
.ring{width:210px;height:210px;border-radius:50%;margin:8px auto 18px;display:flex;align-items:center;justify-content:center;background:conic-gradient(#ff6b6b var(--p,0%),rgba(128,128,128,.22) 0)}
.ring i{width:174px;height:174px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:44px;font-weight:800;direction:ltr}
.center{text-align:center}.sp{margin-top:10px}
.nav{position:fixed;bottom:12px;left:12px;right:12px;background:var(--sec);border-radius:26px;display:flex;padding:8px 4px;box-shadow:0 5px 0 var(--shadow);font-size:11px;font-weight:700;text-align:center;z-index:5}
.nav button{flex:1;background:none;border:0;color:var(--hint);font-family:inherit;font-size:11px;font-weight:700;padding:3px}
.nav button span{display:block;font-size:22px;filter:grayscale(1);opacity:.7}
.nav button.on{color:#ff6b6b}.nav button.on span{filter:none;opacity:1}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="view"></div>
<div class="nav" id="nav"></div>
<div class="toast" id="toast"></div>
<script>
/* No external script is required: Telegram passes everything in the URL hash. */
const HP = new URLSearchParams(location.hash.replace(/^#/, ""));
let INIT = HP.get("tgWebAppData") || "";
try{ const th = JSON.parse(HP.get("tgWebAppThemeParams")||"{}");
  for (const k in th) document.documentElement.style.setProperty("--tg-theme-"+k.replace(/_/g,"-"), th[k]); }catch(e){}
function tgPost(ev, data){
  try{
    if (window.TelegramWebviewProxy) TelegramWebviewProxy.postEvent(ev, JSON.stringify(data||{}));
    else if (window.parent !== window) parent.postMessage(JSON.stringify({eventType:ev,eventData:data||{}}), "*");
  }catch(e){}
}
tgPost("web_app_ready"); tgPost("web_app_expand");
let tg = null; /* optional helper script, loaded late and never blocking */
(function(){ const s=document.createElement("script"); s.async=true; s.src="https://telegram.org/js/telegram-web-app.js";
  s.onload=()=>{ tg = window.Telegram && Telegram.WebApp; if(tg){ if(!INIT) INIT = tg.initData||""; try{tg.expand()}catch(e){} } }; document.head.appendChild(s); })();

let TOOLS = [], cur = null, LIB = null, tab = "home", sel = {stage:null, subject:null, teacher:null, type:null, search:false}, SR = {q:"",stage:"",subject:"",teacher:""}, srT = null, FILE = null, QZ = null, NAME = "";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
try{ const u=JSON.parse(new URLSearchParams(INIT).get("user")||"null"); if(u) NAME=u.first_name||""; }catch(e){}

/* real streak: consecutive days this device opened the app */
let STREAK = 0;
try{
  const today = new Date().toISOString().slice(0,10), st = JSON.parse(localStorage.getItem("streak")||"null")||{};
  if(st.last===today){ STREAK = st.n||1 }
  else{
    const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
    STREAK = st.last===y ? (st.n||0)+1 : 1;
    localStorage.setItem("streak", JSON.stringify({last:today,n:STREAK}));
  }
}catch(e){}

async function api(path, body){
  const ac = new AbortController(); const to = setTimeout(()=>ac.abort(), path==="run"||path==="quiz" ? 120000 : path==="aichat" ? 70000 : 25000);
  let r;
  try { r = await fetch("/api/"+path,{method:"POST",signal:ac.signal,headers:{"Content-Type":"application/json","X-Init-Data":INIT},body:JSON.stringify(body||{})}); }
  catch(e){ throw new Error("تعذر الاتصال بالخادم، تحقق من الإنترنت وحاول مرة أخرى"); }
  finally { clearTimeout(to); }
  const j = await r.json().catch(()=>({error:"خطأ"}));
  if(!r.ok) throw new Error(j.error||"خطأ");
  return j;
}
function nav(){
  const items=[["home","🏠","الرئيسية"],["chat","💬","الدردشة"],["lib","📚","الملازم"],["timer","⏱","المؤقت"],["tools","🤖","الأدوات"]];
  $("nav").innerHTML = items.map(i=>`<button class="${tab===i[0]||(tab==="tool"&&i[0]==="tools")?"on":""}" onclick="go('${i[0]}')"><span>${i[1]}</span>${i[2]}</button>`).join("");
}
function go(t){tab=t;QZ=null;if(t==="lib"){sel={stage:null,subject:null,teacher:null,type:null,search:false}}render();window.scrollTo(0,0)}
function tgl(u){try{Telegram.WebApp.openTelegramLink(u)}catch(e){window.open(u,'_blank')}}
function tileNb(k){return `<button class="t c${k%8}" onclick="go('nb')"><div class="ico">📓</div>دفتر المصادر</button>`}
function tile(t,k){return `<button class="t c${k%8}" onclick="openTool('${t.id}')"><div class="ico">${t.icon}</div>${esc(t.name)}</button>`}
function render(){
  nav();
  const v=$("view");
  if(tab==="home"){
    const main=TOOLS.filter(t=>t.group==="main"),more=TOOLS.filter(t=>t.group!=="main");
    v.innerHTML=`<div class="top"><h1>يلا نذاكر${NAME?" يا "+esc(NAME):""}! 📖</h1></div><div class="cr"><button class="chip lk" onclick="tgl('https://t.me/DenezZE')">👨‍💻 مطور البوت: @DenezZE</button><button class="chip lk" onclick="tgl('https://t.me/TalibSupportBot')">🛠 بوت الإبلاغ عن الأعطال: @TalibSupportBot</button></div>
      <div class="big"><button class="a" onclick="go('lib')"><div class="ico">📚</div>الملازم</button><button class="b" onclick="go('timer')"><div class="ico">⏱</div>المؤقت</button></div>
      <button class="row" style="width:100%;border:0;color:inherit;font-family:inherit;font-size:15px;margin-top:10px" onclick="go('chat')"><span>💬 الدردشة مع الذكاء الاصطناعي</span><small>‹</small></button><h2>🎓 أدوات الدراسة</h2><div class="grid">${main.map(tile).join("")}</div>
      <div style="height:3px;border-radius:3px;background:currentColor;opacity:.18;margin:26px 4px 0"></div><h2>✨ أدوات إضافية</h2><div class="grid">${tileNb(main.length)}${more.map((t,k)=>tile(t,k+main.length+1)).join("")}</div>
      <div style="height:3px;border-radius:3px;background:currentColor;opacity:.18;margin:26px 4px 0"></div><h2>💬 تواصل معنا</h2>
      <button class="row" style="width:100%;border:0;color:inherit;font-family:inherit;font-size:15px;margin-top:0" onclick="tgl('https://t.me/DenezZE')"><span>👨‍💻 المطور: @DenezZE</span><small>‹</small></button>
      <button class="row" style="width:100%;border:0;color:inherit;font-family:inherit;font-size:15px;margin-top:10px" onclick="tgl('https://t.me/TalibSupportBot')"><span>🛠 إبلاغ عن مشكلة: @TalibSupportBot</span><small>‹</small></button>
      <p class="hint center" style="margin:14px 0 4px">طالب AI • تطوير Denez</p>`;
  } else if(tab==="chat"){ renderChat(v) }
  else if(tab==="nb"){ renderNb(v) }
  else if(tab==="lib"){ renderLib(v) }
  else if(tab==="timer"){ renderTimer(v) }
  else if(tab==="tools"){
    const g=n=>TOOLS.filter(t=>t.group===n).map(tile).join("");
    v.innerHTML=`<div class="top"><h1>🤖 كل الأدوات</h1></div><h2>🎓 الأساسية</h2><div class="grid">${g("main")}</div><h2>✨ إضافية</h2><div class="grid">${tileNb(8)}${g("more")}</div>`;
  } else if(tab==="tool"){ renderTool(v) }
}
function openTool(id){cur=TOOLS.find(t=>t.id===id);tab="tool";QZ=null;FILE=null;render();window.scrollTo(0,0)}
function renderTool(v){
  const t=cur;
  const head=`<div class="pill" onclick="go('tools')">‹ رجوع</div><div class="top"><h1>${t.icon} ${esc(t.name)}</h1></div>
    <div class="card hint">💡 ${esc((t.hint||"").replace(/^\S+\s/,""))}</div>`;
  if(t.kind==="quiz"){
    if(QZ&&QZ.qs){return renderQuiz(v,head)}
    v.innerHTML=head+`<textarea class="inp" id="txt" style="min-height:70px" placeholder="✏️ مثال: الفيزياء - الحرارة"></textarea><button class="btn purple" id="go" onclick="startQuiz()">🚀 ابدأ الاختبار</button><div id="out"></div>`;return}
  const wantFile=t.input==="both"||t.input==="audio";
  v.innerHTML=head+(t.input==="audio"?"":`<textarea class="inp" id="txt" placeholder="✏️ اكتب هنا..."></textarea>`)+
    (wantFile?`<label class="filebtn">📎 <span id="fn">${t.input==="audio"?"اختر ملفاً صوتياً":"أرفق صورة أو PDF أو ملف نصي"}</span><input type="file" id="fl" accept="${t.input==="audio"?"audio/*":"image/*,application/pdf,text/plain"}" onchange="pickFile(this)"></label>`:"")+
    `<button class="btn" id="go" onclick="runTool()">✨ نفّذ</button><div id="out"></div>`;
}
function pickFile(i){
  const f=i.files[0];if(!f){FILE=null;return}
  if(f.size>10*1024*1024){toast("⚠️ الحد 10 ميغابايت");i.value="";return}
  const r=new FileReader();r.onload=()=>{FILE={name:f.name,mime:f.type,b64:String(r.result).split(",")[1]};$("fn").textContent="✅ "+f.name};r.readAsDataURL(f);
}
async function runTool(){
  const t=cur,txt=$("txt")?$("txt").value:"";
  const b=$("go");b.disabled=true;b.textContent="⏳ جاري المعالجة...";
  try{
    const j=await api("run",{mode:t.id,text:txt,file:FILE});
    $("out").innerHTML='<div class="res">📝 '+"الإجابة:\n\n"+esc(j.text)+'</div>'+(t.id==="solve"?'<div class="center sp"><button class="btn purple" id="xs" onclick="moreSolve()">📖 شرح أكثر</button></div><div id="out2"></div>':"")+(j.pdf_sent?'<p class="center hint">📄 أُرسل ملف PDF في محادثة البوت</p>':'')+'<div class="center sp"><button class="btn ghost" onclick="copyRes()">📋 نسخ</button></div>';
  }catch(e){$("out").innerHTML='<div class="res">❌ '+esc(e.message)+'</div>'}
  b.disabled=false;b.textContent="✨ نفّذ";
}
async function moreSolve(){
  const b=$("xs"),s=document.querySelector(".res").textContent;b.disabled=true;b.textContent="⏳ جاري الشرح...";
  try{const j=await api("aichat",{op:"xs",solution:s});$("out2").innerHTML='<div class="res">📖 '+esc(j.text)+'</div>'}
  catch(e){$("out2").innerHTML='<div class="res">❌ '+esc(e.message)+'</div>'}
  b.disabled=false;b.textContent="📖 شرح أكثر";
}
function copyRes(){const t=document.querySelector(".res").textContent;navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast("✅ تم النسخ"))}
async function startQuiz(){
  const b=$("go");b.disabled=true;b.textContent="⏳ جاري إنشاء الاختبار...";
  try{const j=await api("quiz",{topic:$("txt").value});QZ={qs:j.questions,i:0,score:0,done:false};render()}
  catch(e){$("out").innerHTML='<div class="res">❌ '+esc(e.message)+'</div>';b.disabled=false;b.textContent="🚀 ابدأ الاختبار"}
}
function renderQuiz(v,head){
  if(QZ.i>=QZ.qs.length){const p=Math.round(100*QZ.score/QZ.qs.length);
    v.innerHTML=head+`<div class="card center"><h2>🏁 انتهى الاختبار</h2><div style="font-size:34px;font-weight:800">${QZ.score} / ${QZ.qs.length} (${p}%)</div><p>${p>=80?"ممتاز! 🌟":p>=50?"جيد، واصل 💪":"راجع الدرس وحاول مجدداً 📖"}</p><button class="btn purple" onclick="QZ=null;render()">🔄 اختبار جديد</button></div>`;return}
  const q=QZ.qs[QZ.i],L=["أ","ب","ج","د","هـ","و"];
  v.innerHTML=head+`<div class="card"><b>❓ س${QZ.i+1}) ${esc(q.q)}</b></div>`+q.options.slice(0,6).map((o,n)=>`<button class="opt" onclick="ans(${n},this)">${L[n]}) ${esc(o)}</button>`).join("")+`<div id="why"></div>`;
}
function ans(n,btn){
  const q=QZ.qs[QZ.i];if(QZ.done)return;QZ.done=true;
  document.querySelectorAll(".opt").forEach((b,i)=>{if(i===q.answer)b.classList.add("ok")});
  const right=n===q.answer; if(right){QZ.score++}else{btn.classList.add("bad")}
  $("why").innerHTML=`<div class="res">${right?"✅ صحيح!":"❌ خطأ"}${q.why?"\n💡 "+esc(q.why):""}</div><div class="center sp"><button class="btn green" onclick="QZ.i++;QZ.done=false;render()">التالي ›</button></div>`;
}
async function renderLib(v){
  if(!LIB){ v.innerHTML='<div class="empty">⏳ جاري التحميل...</div>';
    try{ LIB=(await api("library")).stages }catch(e){ v.innerHTML='<div class="empty">❌ '+esc(e.message)+'<br><br><button class="btn" onclick="LIB=null;render()">🔄 إعادة المحاولة</button></div>'; return } }
  const title='<div class="top"><h1>📚 الملازم</h1></div>';
  const back=(js)=>`<div class="pill" onclick="${js};render()">‹ رجوع</div>`;
  const row=(icon,name,n,unit,fn)=>`<div class="row" onclick="${fn}"><span>${icon} ${esc(name)}</span><small>${n} ${unit} ‹</small></div>`;
  if(!LIB.length){ v.innerHTML=title+'<div class="empty">📭 لا توجد ملازم بعد، سنضيفها قريباً.</div>'; return }
  if(sel.search){ renderSearch(v); return }
  if(sel.stage===null){
    const sr='<div class="row" onclick="sel.search=true;render()"><span>🔍 بحث في الملازم</span><small>مادة، أستاذ، عنوان ‹</small></div>';
    const g=sel.g, un=LIB.some(s=>s.n===9), none='<div class="empty">📭 لا توجد ملازم بعد.</div>';
    if(g==null){
      v.innerHTML=title+sr+'<h2>🎓 اختر المرحلة</h2>'+GN.map((x,n)=>row("🎓",x,ct(n,[0,1,2,3,4]),"ملف",`gp(${n})`)).join("")+(un?row("📂","غير مصنفة",ct(9,[0]),"ملف","sel.g=9;render()"):""); return }
    if(g===9){
      v.innerHTML=back("sel.g=null")+title+'<h2>📂 ملازم غير مصنفة بعد</h2>'+LIB.map((s,i)=>s.n===9?row("📂",s.name,s.subjects.reduce((a,j)=>a+j.n,0),"ملف",`pick(${i})`):"").join(""); return }
    if(g>=3 && sel.tr===1 && ct(g,[3,4])>0){
      v.innerHTML=back("sel.tr=null")+title+`<h2>🔬 ${GN[g]} العلمي</h2>`+(ct(g,[3])?row("🧬","الأحيائي",ct(g,[3]),"ملف",`pg(${g},3)`):"")+(ct(g,[4])?row("⚙️","التطبيقي",ct(g,[4]),"ملف",`pg(${g},4)`):"")+(ct(g,[1])?row("📂","علمي عام",ct(g,[1]),"ملف",`pg(${g},1)`):""); return }
    if(g>=3){
      const b=(ct(g,[1,3,4])?row("🔬","العلمي",ct(g,[1,3,4]),"ملف",ct(g,[3,4])?"sel.tr=1;render()":`pg(${g},1)`):"")+(ct(g,[2])?row("📖","الأدبي",ct(g,[2]),"ملف",`pg(${g},2)`):"")+(ct(g,[0])?row("📂","عام",ct(g,[0]),"ملف",`pg(${g},0)`):"");
      v.innerHTML=back("sel.g=null")+title+`<h2>🎓 ${GN[g]}</h2>`+(b||none); return }
    v.innerHTML=back("sel.g=null")+title+`<h2>🎓 ${GN[g]}</h2>`+none; return }
  const st=LIB[sel.stage];
  if(sel.subject===null){
    v.innerHTML=back("bk()")+title+`<h2>📖 اختر المادة (${esc(st.name)})</h2>`+
      (st.subjects.length?st.subjects.map((j,i)=>row("📖",j.name,j.n,"ملف",`pickSub(${i})`)).join(""):'<div class="empty">📭 لا توجد مواد بعد.</div>'); return }
  const sj=st.subjects[sel.subject];
  if(sel.teacher===null){
    v.innerHTML=back("sel.subject=null")+title+`<h2>👨‍🏫 اختر الأستاذ (${esc(sj.name)})</h2>`+
      (sj.teachers.length?sj.teachers.map((t,i)=>row("👨‍🏫",t.name,t.n,"ملف",`pickT(${i})`)).join(""):'<div class="empty">📭 لا توجد ملازم بعد.</div>'); return }
  const tc=sj.teachers[sel.teacher];
  if(sel.type===null){
    v.innerHTML=back("sel.teacher=null")+title+`<h2>🗂 اختر النوع (${esc(tc.name)} · ${esc(sj.name)})</h2>`+
      tc.types.map((y,i)=>row("🗂",y.name,y.n,"ملف",`pickY(${i})`)).join(""); return }
  const ty=tc.types[sel.type];
  v.innerHTML=back("sel.type=null")+title+`<h2>📄 ${esc(ty.name)} · ${esc(tc.name)} · ${esc(sj.name)}</h2>`+
    ty.files.map(f=>`<div class="row"><span>📄 ${esc(f.title)}</span><button class="btn green" style="padding:10px 14px;font-size:14px" onclick="dl(${f.id},this)">⬇ تحميل</button></div>`).join("");
}
function renderSearch(v){
  const stages=LIB.map(s=>s.name), subs=[...new Set(LIB.flatMap(s=>s.subjects.map(j=>j.name)))], tch=[...new Set(LIB.flatMap(s=>s.subjects.flatMap(j=>j.teachers.map(t=>t.name))))];
  const opt=(arr,cur,all)=>`<option value="">${all}</option>`+arr.map(x=>`<option value="${esc(x)}"${x===cur?" selected":""}>${esc(x)}</option>`).join("");
  const sty='style="width:100%;margin-bottom:8px;padding:12px;border-radius:16px;border:2px solid var(--shadow);background:var(--sec);color:var(--tx);font:inherit"';
  v.innerHTML=`<div class="pill" onclick="sel.search=false;render()">‹ رجوع</div><div class="top"><h1>🔍 بحث في الملازم</h1></div>
   <input id="sq" ${sty} placeholder="🔎 مادة، أستاذ، عنوان، سنة، نوع..." value="${esc(SR.q)}" oninput="srGo()">
   <select id="sf1" ${sty} onchange="srGo()">${opt(stages,SR.stage,"🎓 كل المراحل")}</select>
   <select id="sf2" ${sty} onchange="srGo()">${opt(subs,SR.subject,"📖 كل المواد")}</select>
   <select id="sf3" ${sty} onchange="srGo()">${opt(tch,SR.teacher,"👨‍🏫 كل الأساتذة")}</select>
   <div id="sres"></div>`;
  srRun();
}
function srGo(){SR.q=$("sq").value;SR.stage=$("sf1").value;SR.subject=$("sf2").value;SR.teacher=$("sf3").value;clearTimeout(srT);srT=setTimeout(srRun,350)}
async function srRun(){
  const box=$("sres"); if(!box)return;
  if(!SR.q.trim()&&!SR.stage&&!SR.subject&&!SR.teacher){box.innerHTML='<div class="empty">✍️ اكتب كلمة للبحث أو اختر مادة/مرحلة/أستاذ.</div>';return}
  box.innerHTML='<div class="empty">⏳ جاري البحث...</div>';
  const mine={...SR};
  try{
    const r=await api("search",mine);
    if(JSON.stringify(mine)!==JSON.stringify(SR))return;
    box.innerHTML=r.files.length?`<h2>📄 النتائج (${r.total})</h2>`+r.files.map(f=>`<div class="row"><span>📄 ${esc(f.title)}<br><small>🎓 ${esc(f.stage)} · 📖 ${esc(f.subject)} · 🗂 ${esc(f.type)}</small></span><button class="btn green" style="padding:10px 14px;font-size:14px" onclick="dl(${f.id},this)">⬇ تحميل</button></div>`).join(""):'<div class="empty">😕 لا توجد نتائج. جرّب كلمات أقل.</div>';
  }catch(e){box.innerHTML='<div class="empty">❌ '+esc(e.message)+'</div>'}
}
const GN=["الأول المتوسط","الثاني المتوسط","الثالث المتوسط","الرابع الإعدادي","الخامس الإعدادي","السادس الإعدادي"];
function rw(n,ts){return LIB.map((s,i)=>({s,i})).filter(o=>o.s.n===n&&ts.includes(o.s.t))}
function ct(n,ts){return rw(n,ts).reduce((a,o)=>a+o.s.subjects.reduce((b,j)=>b+j.n,0),0)}
function pg(n,t){const r=rw(n,[t]);if(r.length)pick(r[0].i)}
function gp(n){if(n<3&&rw(n,[0]).length)pg(n,0);else{sel.g=n;sel.tr=null;render()}}
function bk(){const s=LIB[sel.stage];sel.stage=null;sel.g=s.n<3?null:s.n;sel.tr=(s.n>3&&s.n<9&&(s.t>=3||(s.t===1&&ct(s.n,[3,4])>0)))?1:null}
let NBS=null,NBO="",NBF=null,NBB=false;
async function nbCall(b){
  NBB=true;NBO=b.act==="ask"||b.act==="sum"||b.act==="q"||b.act==="map"?"⏳ جاري التحضير...":NBO;render();
  try{const j=await api("aichat",Object.assign({op:"nb"},b));NBS=j.srcs;NBO=j.text||(b.act==="clear"?"":"");if(b.act==="add")NBO="✅ تمت إضافة المصدر"}
  catch(e){NBO="❌ "+e.message}
  NBB=false;NBF=null;render();
}
function nbFile(i){const f=i.files[0];if(!f)return;if(f.size>10*1024*1024){toast("⚠️ الحد 10 ميغابايت");i.value="";return}
  const r=new FileReader();r.onload=()=>nbCall({act:"add",file:{name:f.name,mime:f.type,b64:String(r.result).split(",")[1]}});r.readAsDataURL(f)}
function nbPaste(){const t=$("nbt").value.trim();if(t.length<30){toast("الصق نصاً أطول");return}nbCall({act:"add",text:t})}
function nbAsk(){const t=$("nbq").value.trim();if(!t)return;nbCall({act:"ask",text:t})}
function renderNb(v){
  if(NBS===null){NBS=[];nbCall({act:"state"})}
  v.innerHTML=`<div class="pill" onclick="go('home')">‹ رجوع</div><div class="top"><h1>📓 دفتر المصادر</h1></div><div class="card hint">💡 أضف ملازمك (PDF أو صورة أو نص) ثم اسأل: أجيبك من مصادرك فقط.</div>
  <div class="card"><b>مصادرك (${NBS.length}/6)</b><div style="white-space:pre-wrap;margin-top:4px">${NBS.length?esc(NBS.map((n,i)=>(i+1)+") "+n).join("\n")):"لا توجد مصادر بعد."}</div></div>
  <label class="filebtn">📎 <span>إضافة ملف PDF أو صورة</span><input type="file" accept="image/*,application/pdf,text/plain" onchange="nbFile(this)"></label>
  <textarea class="inp" id="nbt" placeholder="أو الصق نصاً طويلاً هنا..." style="min-height:60px"></textarea><button class="btn" onclick="nbPaste()">➕ إضافة النص</button>
  <button class="btn purple" onclick="nbCall({act:'sum'})">📝 ملخص</button><button class="btn purple" onclick="nbCall({act:'q'})">❓ أسئلة</button><button class="btn purple" onclick="nbCall({act:'map'})">🗺 خريطة ذهنية</button>
  <textarea class="inp" id="nbq" placeholder="✏️ اسأل عن مصادرك..." style="min-height:60px"></textarea><button class="btn" ${NBB?"disabled":""} onclick="nbAsk()">📨 اسأل</button>
  ${NBO?`<div class="res" style="white-space:pre-wrap">${esc(NBO)}</div>`:""}<button class="btn ghost" onclick="nbCall({act:'clear'})">🗑 مسح المصادر</button>`;
}
let CHT=[],CHB=false,CHE="",CHG=null;
async function chatEng(s){try{CHG=await api("aichat",s?{op:"eng",set:s}:{op:"eng"})}catch(e){} render()}
function renderChat(v){
  if(CHG===null){CHG=false;chatEng()}
  v.innerHTML=`<div class="top"><h1>💬 الدردشة مع الذكاء الاصطناعي</h1></div><div class="card hint">💡 اسألني أي شيء وسأجيبك باختصار. أتذكر ما قلناه في هذه المحادثة.</div>${CHG&&CHG.list.length>1?`<div class="card">المحرك: ${CHG.list.map(x=>`<button class="btn${x.id===CHG.eng?" purple":""}" style="display:inline-block;width:auto;margin:3px;padding:6px 10px" onclick="chatEng('${x.id}')">${esc(x.t)}</button>`).join("")}</div>`:""}<div id="cmsgs">${CHT.map(m=>`<div class="card"${m.r==="u"?' style="background:var(--sec)"':''}><b>${m.r==="u"?"🧑 أنت":"🤖 المساعد"}</b><div style="white-space:pre-wrap;margin-top:4px">${esc(m.t)}</div></div>`).join("")}${CHB?'<div class="empty">⏳ يكتب...</div>':""}${CHE?`<div class="card" style="color:#e55">${esc(CHE)}</div>`:""}</div><textarea class="inp" id="cin" placeholder="✏️ اكتب رسالتك..." style="min-height:60px"></textarea><button class="btn purple" onclick="chatSend()">📨 إرسال</button><button class="btn" onclick="chatEnd()">🛑 إنهاء الدردشة</button>`;
}
async function chatSend(){
  const el=$("cin"); const t=(el&&el.value||"").trim(); if(!t||CHB)return;
  const h=CHT.slice(-12); CHB=true; CHE=""; CHT.push({r:"u",t}); render();
  try{ const j=await api("aichat",{text:t,history:h}); CHT.push({r:"a",t:j.text}); CHB=false; render() }
  catch(e){ CHT.pop(); CHB=false; CHE=e.message; render(); const x=$("cin"); if(x)x.value=t }
}
function chatEnd(){CHG=null;CHT=[];CHB=false;CHE="";go("home")}
function pick(i){sel={stage:i,subject:null,teacher:null,type:null,search:false};render()}
function pickSub(i){sel.subject=i;sel.teacher=null;sel.type=null;render()}
function pickT(i){sel.teacher=i;sel.type=null;render()}
function pickY(i){sel.type=i;render()}
async function dl(id,b){
  b.disabled=true;
  try{await api("download",{id});toast("✅ أُرسلت الملزمة في محادثة البوت")}catch(e){toast("❌ "+e.message)}
  b.disabled=false;
}
/* timer */
let T={total:0,end:0,iv:null};
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function renderTimer(v){
  v.innerHTML=`<div class="top"><h1>⏱ مؤقت المذاكرة</h1></div><div class="ring" id="ring"><i id="tm">${fmt(T.total?Math.round((T.end-Date.now())/1000):25*60)}</i></div>
  <div class="center"><div class="hint" style="margin-bottom:14px" id="tmsg">${T.iv?"ركّز... 💪":"اختر مدة التركيز 🎯"}</div>
  <button class="btn" onclick="startT(25)">🍅 25 دقيقة</button> <button class="btn purple" onclick="startT(45)">📚 45 دقيقة</button>
  <div class="sp"><button class="btn ghost" onclick="stopT()">⏹ إيقاف</button></div>
  <p class="hint">🔔 سيرسل لك البوت تنبيهاً في المحادثة عند انتهاء التركيز وعند انتهاء الاستراحة.</p></div>`;
  tick();
}
async function startT(m){
  stopT(true);T.total=m*60;T.end=Date.now()+m*60000;
  T.iv=setInterval(tick,500);
  try{await api("timer",{mins:m});toast("⏱ بدأ المؤقت وسأنبهك في المحادثة")}catch(e){toast("❌ "+e.message)}
  renderTimer($("view"));
}
function stopT(silent){if(T.iv){clearInterval(T.iv);T.iv=null}T.total=0;if(!silent&&tab==="timer")renderTimer($("view"))}
function tick(){
  if(!T.total){return}
  const left=Math.round((T.end-Date.now())/1000);
  const tm=$("tm"),ring=$("ring");
  if(tm)tm.textContent=fmt(left);
  if(ring)ring.style.setProperty("--p",((1-left/T.total)*100)+"%");
  if(left<=0){clearInterval(T.iv);T.iv=null;T.total=0;toast("⏰ انتهى التركيز!");if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred("success");const m=$("tmsg");if(m)m.textContent="أحسنت! خذ استراحة 🎉"}
}
function loadTools(){
  $("view").innerHTML = '<div class="empty">⏳ جاري التحميل...</div>';
  api('tools').then(j=>{TOOLS=j.tools;render()}).catch(e=>{
    $("view").innerHTML = '<div class="empty">❌ '+esc(e.message)+'<br><br><button class="btn" onclick="loadTools()">🔄 إعادة المحاولة</button></div>';
  });
}
render(); loadTools();
</script>
</body>
</html>
